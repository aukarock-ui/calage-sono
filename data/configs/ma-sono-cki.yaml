# Configuration CKI — pile mono 4 voies en colonne (un seul bloc), sans super-aigus. Décrite par Louis le 24/11/2026.
# Mêmes caisses que ma-sono-actuel ; amplis différents. Pile (photo du 24/11/2026), du bas vers le haut :
# Sorties VENU360 (câblage des presets 4VM) : 1 HIGH, 2 MEDIUM, 3 KICK, 4 SUB, 5-6 libres.
# 2 SUB couchés, 4 KICK debout, 2 MEDIUM couchés, 2 HIGH (HP640). Super-aigus retirés. Les champs null sont à renseigner.

nom: ma-sono-cki
proprietaire: Louis
type_systeme: composants
processeur: DBX_VENU360
processeur_reglage_sortie: "+22"
processeur_reglage_sortie_confirme: true   # relu sur la machine le 23/11/2026 (Output1..6Gain = +22 dBu)
processeur_overshoot_db: 6                 # PeakStopPlus OVERSHOOT, valeur par défaut relue sur la machine
processeur_unite_seuil: dBFS
preferences: "Réglages processeur fixes (set and forget), ajustements par style à la console ; voicing bass-heavy assumé ; préserver le grain du CP650Ti ; CP650Ti limités à 75 %."
pourcentage_puissance_limite: 0.75
temperature_c: 20

voies:
  - nom: SUB
    type: composants
    sortie: 4
    hp: RCF_LF21X451
    hp_en_serie: 1
    branches_paralleles: 2        # 2 caisses 1×21" 8 Ω en parallèle -> 4 Ω
    ampli: QSC_PL380
    mode: bridge
    gain_canal_db: 32             # sélecteur arrière PL380 sur 32 dB (Louis, 24/11/2026)
    charge: "bass-reflex couché, 1×21\""
    accord_event_hz: null
  - nom: KICK
    type: composants
    sortie: 3
    hp: BEYMA_SM118_GEN1
    hp_en_serie: 2
    branches_paralleles: 4        # 4 caisses 2×18" série (16 Ω) en parallèle -> 4 Ω
    ampli: QSC_PLX3402            # absent de materiel.yaml : fiche QSC à fournir
    mode: bridge
    gain_canal_db: 32             # gain fixe constructeur (40×)
    charge: "bass-reflex debout, 2×18\" en série (16 Ω/caisse)"
    accord_event_hz: null
  - nom: MEDIUM
    type: composants
    sortie: 2
    hp: BEYMA_SM115_GEN1
    hp_en_serie: 2
    branches_paralleles: 2        # 2 caisses 2×15" série (16 Ω) en parallèle -> 8 Ω
    ampli: QSC_PLX3002
    mode: bridge
    gain_canal_db: 32             # gain fixe constructeur (40×)
    charge: "clos, 2×15\" en série (16 Ω/caisse)"
  - nom: HIGH
    type: composants
    sortie: 1
    hp: BEYMA_CP650TI
    hp_en_serie: 1
    branches_paralleles: 1        # RMX1450 en parallèle : 1 CP650Ti 8 Ω par canal, même signal
    ampli: QSC_RMX1450
    mode: parallele
    gain_canal_db: 32             # gain fixe constructeur (40×)
    charge: "CP650Ti sur EV HP640"

# Point de départ : coupures validées sur ma-sono-actuel (oct. 2026), sans SUPER -> HIGH sans passe-bas. À re-valider par mesure.
crossover:
  SUB:    {hpf: "LR24 35 Hz", lpf: "LR24 90 Hz"}   # HPF validé par excursion_br : Xmax tenu pour fb 28-40 Hz et Vb 400-550 L ; accord à mesurer
  KICK:   {hpf: "LR24 90 Hz", lpf: "LR24 400 Hz"}
  MEDIUM: {hpf: "LR24 400 Hz", lpf: "LR24 1600 Hz"}
  HIGH:   {hpf: "LR24 1600 Hz", lpf: null}
  note: "HPF SUB obligatoire (bass-reflex) : accord non mesuré -> à fixer d'après excursion_br / mesure."

# Plages supposées tant que l'accord (impédance) et le volume net ne sont pas mesurés : preset_auto vérifie le HPF
# (excursion_br) sur TOUTE la plage. SUB : caisse 135×71×63 cm (≈ 600 L brut, ~400-550 L net estimé), accord inconnu.
hypotheses_caisse:
  SUB: {accord_hz: [28, 40], volume_l: [400, 550]}
  # KICK : accord et volume inconnus -> HPF LR24 90 Hz NON vérifié en excursion. Décision de Louis (24/11/2026) :
  # accepté (preset_auto --accepter-non-verifie), à vérifier à la mesure micro (et impédance pour l'accord).

style_defaut: techno

caisses:
  SUB:    {l: 135, p: 71, h: 63, note: "couché"}
  KICK:   {l: 69,  p: 51, h: 121}
  MEDIUM: {l: 121, p: 71, h: 51, note: "couché (photo Louis 24/11/2026)"}
  HIGH:   {l: 82,  p: 58, h: 48}

# Géométrie de la pile pour le calcul des délais (tools/reglages_pile.py).
# profondeur_cm = centre acoustique derrière la face avant de la pile ; hauteur_cm = hauteur de ce centre au-dessus du sol.
# Toutes les PROFONDEURS sont des HYPOTHÈSES tant que l'IR ne les a pas confirmées :
#   HIGH : HP640 43,7 cm de long (fiche EV) + ~4 cm de trajet dans le moteur (supposé) + ~2 cm de retrait (photo) ;
#   MEDIUM/KICK/SUB : centre acoustique supposé vers la bobine (cône de 15/18/21" + retrait de la grille, photo).
# Hauteurs : palette ~14 cm (photo) + empilement des caisses (champ caisses) ; HP au milieu de leur caisse.
geometrie_pile:
  SUB:    {profondeur_cm: 21, hauteur_cm: 45}
  KICK:   {profondeur_cm: 15, hauteur_cm: 138}
  MEDIUM: {profondeur_cm: 12, hauteur_cm: 224}
  HIGH:   {profondeur_cm: 50, hauteur_cm: 273}

# Réglages calculés (tools/reglages_pile.py, 24/11/2026) et écrits dans le VENU360 case 27 « CKI 4V Mono ».
# À comparer à la mesure : noter ici l'écart mesuré pour corriger le modèle (centres acoustiques, phase des HP).
reglages_calcules:
  limiteurs:   # Proel DSO26 p. 34 (attaque selon HPF, relâchement 16x) ; conversion dB/s = 8,686/τ (hypothèse)
    HIGH:   {attaque_ms: 0.5, relachement_db_s: 360, note: "1086 dB/s calculés, borné au max du VENU360"}
    MEDIUM: {attaque_ms: 2,   relachement_db_s: 271}
    KICK:   {attaque_ms: 8,   relachement_db_s: 68}
    SUB:    {attaque_ms: 16,  relachement_db_s: 34}
  delais_ms:   # point d'écoute 20 m / 1,7 m ; quasi identique à 8 m
    HIGH: 0
    MEDIUM: 1.23
    KICK: 1.70
    SUB: 4.60
  gains_sortie_db:   # équilibre à niveau processeur égal (sensibilités fiche, bridge +6 dB, somme cohérente < 1 kHz)
    HIGH: -4.0      # incertain : sensibilité CP650Ti donnée sur TD-460, pas HP640
    MEDIUM: -2.0
    KICK: -6.0
    SUB: 0.0        # voicing bass-heavy de Louis non appliqué : à décider à la mesure / à la console
  gains_style:      # preset_auto --style techno (profil « exigeant », +16 dB vers 55 Hz) ; écrits case 27 « CKI 4V Techno » le 24/11/2026
    techno: {HIGH: -19.9, MEDIUM: -16.3, KICK: -12.6, SUB: 0.0}
  puissance_techno: "voie limitante SUB ; plateau ≈ 93 dB à 20 m contre 108 dB(A) visés (−15 dB, une pile, champ libre)"
  mesure: {date: null, ecarts: null}   # les écarts mesurés vont dans ma-sono-cki.recalage.yaml (preset_auto --recaler)
